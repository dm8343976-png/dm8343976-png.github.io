<html lang="es"><head><meta charset="utf-8">

<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#c8372d;--bl:#1f4e9c;--bd:#e2ded6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--card:#23252b;--tx:#f1f0ec;--mu:#a3a3aa;--ac:#ff6b5e;--bl:#7fa8ff;--bd:#34363d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181c;--card:#23252b;--tx:#f1f0ec;--mu:#a3a3aa;--ac:#ff6b5e;--bl:#7fa8ff;--bd:#34363d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:19px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--mu)}
.st b{display:block;font-size:17px;color:var(--tx)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
button{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin:8px 0;cursor:pointer}
button:active{transform:scale(.98)}button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
button:disabled{opacity:.45}
.mu{color:var(--mu);font-size:14px}
input,select{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;margin:8px 0}
button.sel{border:2px solid var(--bl)}.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.g{color:#1f8a4c}.r{color:var(--ac)}
</style></head><body><div id="app"></div>

{t:'Ignorarlo',f:()=>Math.random()<.5?{d:{k:-4},r:'La tos sigue, pero aguantas.'}:{d:{m:-hosp(2500),k:-10,sick:1},r:'Terminas en urgencias con una infección en los pulmones.'}}]},

{t:'Esperar un día en casa',f:()=>Math.random()<.6?{d:{k:-3},r:'La fiebre baja sola.'}:{d:{m:-hosp(3000),k:-10,sick:1},r:'Empeora y lo internan. Tienes que quedarte con él y casi no trabajas.'}}]},
{c:()=>s.kids>0,t:'Hay una función en la escuela de tu hijo el mismo día que tienes turno.',o:[

{c:()=>!!s.partner,t:'Tú y tu pareja discuten por dinero.',o:[

{t:'Salir enojado',d:{k:-8},r:'Pasas la noche dando vueltas por la calle.'}]},

{t:'Tomar pastillas y seguir',f:()=>Math.random()<.5?{d:{k:-6},r:'Se te pasa en unos días. Tuviste suerte.'}:{d:{m:-hosp(3800),k:-14,sick:1},r:'Empeora y terminas internado en el hospital. Cuesta más y casi no puedes trabajar este mes.'}}]},
{t:'Te da un dolor fuerte en el abdomen de madrugada. En el hospital dicen que es apendicitis.',o:[

{t:'Pedir ayuda financiera al hospital',f:()=>({d:{m:-hosp(3800),k:-10,sick:1},r:'Te aprueban un descuento y un plan de pagos. Igual duele, pero es manejable.'})}]},
{t:'Un virus fuerte te tumba con fiebre alta.',o:[
{t:'Ir a urgencias',f:()=>({d:{m:-hosp(1200),k:-4,sick:1},r:'Te ponen suero y te mandan a reposo. Pierdes varios días de trabajo.'})},
{t:'Quedarte con remedios caseros',f:()=>Math.random()<.65?{d:{k:-5,m:-50},r:'Con sopa y descanso te recuperas.'}:{d:{m:-hosp(2500),k:-10,sick:1},r:'Empeoras y terminas en el hospital.'}}]},
{t:'Una muela te duele horrible.',o:[
{t:'Ir al dentista ($350)',d:{m:-350,k:5},r:'Te la sacan y vuelves a sonreír.'},
{t:'Clínica dental comunitaria ($120)',d:{m:-120,k:1},r:'Esperas semanas, pero ahorras.'},
{t:'Aguantar el dolor',d:{k:-10},r:'Duermes mal y trabajas peor.'}]},
{t:'Tu mejor amigo termina en el hospital y no tiene a nadie más.',o:[
{t:'Quedarte con él toda la noche',d:{k:6,e:2,m:-80},r:'Hablas con enfermeras y practicas inglés. Él nunca lo olvidará.'},
{t:'Pasar solo un rato',d:{k:2,e:1},r:'Lo visitas y sigues con tu vida.'},
{t:'No ir',d:{k:-8},r:'Te queda un peso en el pecho.'}]},
{t:'Llevas semanas sin dormir bien y extrañas todo de tu país.',o:[
{t:'Buscar terapia comunitaria ($60)',d:{m:-60,k:12},r:'Hablar ayuda más de lo que pensabas.'},
{t:'Llamar a tu familia',d:{k:8},r:'Un rato con ellos te recarga.'},
{t:'Trabajar más para distraerte',d:{m:300,k:-8},r:'Cobras, pero te vacías por dentro.'}]},
{t:'Un carro te choca cuando ibas en bicicleta al trabajo.',o:[
{t:'Ir a que te revisen',f:()=>({d:{m:-hosp(2200),k:-6,sick:1},r:'Solo fueron golpes fuertes, pero necesitas reposo.'})},
{t:'Decir que estás bien',f:()=>Math.random()<.6?{d:{k:-4},r:'Tienes moretones, pero nada grave.'}:{d:{m:-hosp(3000),k:-10,sick:1},r:'Al día siguiente no puedes ni caminar y terminas en el hospital.'}}]},
{t:'Te roban el celular en el autobús.',o:[
{t:'Comprar uno nuevo ($300)',d:{m:-300,k:-2},r:'Lo necesitas para trabajar.'},
{t:'Comprar uno usado ($120)',d:{m:-120,k:-3},r:'Funciona, aunque con la pantalla rota.'}]},
{t:'El casero avisa que subirá el alquiler.',o:[
{t:'Aceptar',d:{m:-150,k:-3},r:'No tienes ganas de mudarte.'},
{t:'Negociar',f:()=>Math.random()<.5?{d:{k:4,m:-40},r:'Logras que suba solo $40.'}:{d:{k:-4,m:-150},r:'No acepta negociar.'}}]},
{t:'Te llaman diciendo que ganaste un premio, pero debes pagar $200 primero.',o:[
{t:'Pagar',d:{m:-200,k:-8},r:'Era una estafa.'},
{t:'Colgar',d:{k:3},r:'Desconfiaste a tiempo.'}]},
{t:'Tu jefe nota tu esfuerzo y te ofrece $500 extra si haces dos horas más cada día este mes.',o:[
{t:'Aceptar',d:{m:500,k:-7},r:'Ganas más, pero llegas rendido a casa.'},
{t:'Rechazar',d:{k:2},r:'Cuidas tu energía.'}]},
{t:'Tu mamá llama: necesitan ayuda con una reparación en casa.',o:[

{t:"Mandar $200",d:{m:-200,k:3},r:"Es poco, pero ayuda."},
{t:"Explicar que no puedes",d:{k:-6},r:"Te quedas con culpa."}]}];
const CE={mia:[{t:"Hay un festival latino en el centro.",o:[{t:"Ir con amigos ($80)",d:{m:-80,k:10,e:1},r:"Baile, comida y nuevas amistades."},{t:"Vender comida allí",d:{m:350,k:2,e:1},r:"Vendes todo en horas."}]}],
lv:[{t:"Un amigo te invita al casino.",o:[{t:"Apostar $300",f:()=>Math.random()<.4?{d:{m:600,k:8},r:"¡Ganaste $600! No te acostumbres."}:{d:{m:-300,k:-8},r:"Perdiste los $300. Aprendiste."}},{t:"Solo ver el espectáculo ($100)",d:{m:-100,k:7},r:"Una noche inolvidable."},{t:"No ir",d:{k:2},r:"Te quedas con tu dinero."}]}],
tx:[{t:"Hay horas extra en la obra por una tormenta.",o:[{t:"Hacer las horas extra",d:{m:700,k:-8},r:"Cobras bien, pero terminas agotado."},{t:"Decir que no",d:{k:3},r:"Descansas."}]},
{t:"Tus vecinos hacen una barbacoa.",o:[{t:"Ir y llevar bebidas ($40)",d:{m:-40,k:9,e:2},r:"Practicas inglés entre risas."}]}],
ny:[{t:"Pierdes el metro y llegas tarde a tu turno.",o:[{t:"Tomar un taxi ($40)",d:{m:-40,k:2},r:"Llegas a tiempo, pero duele el bolsillo."},{t:"Esperar el siguiente tren",d:{k:-4},r:"Tu jefe frunce el ceño."}]}],
ca:[{t:"Un amigo te ofrece trabajo temporal en la cosecha.",o:[{t:"Aceptar",d:{m:800,k:-6,e:0},r:"Trabajo duro, pero buen pago."},{t:"Rechazar",d:{k:1},r:"Sigues con tu rutina."}]}],
bos:[{t:"El invierno llega fuerte y necesitas abrigo.",o:[{t:"Comprar abrigo bueno ($200)",d:{m:-200,k:4},r:"Sobrevives el frío."},{t:"Usar ropa vieja",d:{k:-8},r:"Pasas mucho frío."}]},
{t:"Un community college ofrece clases nocturnas de inglés.",o:[{t:"Inscribirte ($300)",d:{m:-300,k:-2,e:10},r:"Tu inglés da un salto grande."},{t:"Esperar",d:{},r:"Quizás el próximo semestre."}]}]};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const O=["México","Colombia","Venezuela","Cuba","República Dominicana","Guatemala","Honduras","El Salvador","Perú","Argentina","Brasil","India","Filipinas","Otro país"];
const P={est:{n:"🎓 Estudiante",d:"Inglés 45 · $1,500 · ánimo 80",m:1500,k:80,e:45},aho:{n:"💰 Con ahorros",d:"$4,000 · ánimo 70 · inglés 25",m:4000,k:70,e:25},soc:{n:"🎉 Sociable",d:"$1,500 · ánimo 95 · inglés 35",m:1500,k:95,e:35},tra:{n:"🔧 Trabajador con experiencia",d:"$2,200 · ánimo 80 · inglés 25",m:2200,k:80,e:25}};
let ch={name:"",origin:"México",prof:"est"};
function start(){creator()}
function creator(){show(`<h1>🇺🇸 Yumita Life</h1><p class="mu">Crea tu personaje y construye tu vida en 24 meses. No hay historia escrita: tú decides todo.</p><div class="card"><h2>Tu personaje</h2><input value="${esc(ch.name)}" placeholder="Tu nombre" oninput="ch.name=this.value"><select onchange="ch.origin=this.value">${O.map(o=>`<option ${o==ch.origin?"selected":""}>${o}</option>`).join("")}</select></div><h2>Tu perfil</h2>`+Object.keys(P).map(k=>`<button class="${ch.prof==k?"sel":""}" onclick="ch.prof='${k}';creator()"><b>${P[k].n}</b><br><span class="mu">${P[k].d}</span></button>`).join("")+`<button class="p" onclick="ch.name=ch.name.trim()||'Tú';cityPick()">Elegir ciudad →</button>`)}
let s;
const fm=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const cl=n=>Math.max(0,Math.min(100,n));
const stats=()=>`<div class="top"><span>${esc(ch.name)}${s.partner?' ❤️':''}${s.kids?' 👶'+s.kids:''} · ${C[s.city].e} ${C[s.city].n} · ${J[s.job].n}</span><span>Mes ${s.month}/24</span></div>
<div class="stats"><div class="st">💵<b>${fm(s.money)}</b>Dinero</div>
<div class="st">😀<b>${s.mood}</b>Ánimo<div class="bar"><i style="width:${s.mood}%"></i></div></div>
<div class="st">🗣️<b>${s.eng}</b>Inglés<div class="bar"><i style="width:${s.eng}%"></i></div></div></div>`;
const show=h=>{$.innerHTML=h;window.scrollTo(0,0)};
function cityPick(){
show(`<h1>🌎 ${esc(ch.name)}</h1><p class="mu">Llegas desde ${ch.origin} a Estados Unidos. Puedes viajar entre ciudades, cambiar de trabajo y tomar decisiones difíciles.</p><h2>¿Dónde empiezas?</h2>`+
Object.keys(C).map(k=>`<button onclick="go('${k}')">${C[k].e} <b>${C[k].n}</b><br><span class="mu">${C[k].d} · alquiler ${fm(C[k].rent)}</span></button>`).join("")+`<button onclick="creator()">← Volver</button>`)}
function go(k){const p=P[ch.prof];s={city:k,job:"limp",money:p.m,mood:p.k,eng:p.e,month:1,seen:[]};event()}
function event(){let pool=[...EV,...(CE[s.city]||[])].filter(e=>!s.seen.includes(e.t)&&(!e.c||e.c()));
if(!pool.length){s.seen=[];pool=EV}
const e=pool[Math.floor(Math.random()*pool.length)];s.seen.push(e.t);window._e=e;
show(stats()+`<div class="card"><h2>Mes ${s.month}</h2><p>${e.t}</p></div>`+e.o.map((o,i)=>`<button onclick="pick(${i})">${o.t}</button>`).join(""))}
function apply(d){if(d.sick)s.sick=1;s.money+=d.m||0;s.mood=cl(s.mood+(d.k||0));s.eng=cl(s.eng+(d.e||0))}
function pick(i){const o=window._e.o[i];const x=o.f?o.f():{d:o.d,r:o.r};apply(x.d);
const ch=[["m",x.d.m,"💵"],["k",x.d.k,"😀"],["e",x.d.e,"🗣️"]].filter(c=>c[1]).map(c=>`<span class="${c[1]>0?"g":"r"}">${c[2]} ${c[1]>0?"+":""}${c[0]=="m"?fm(c[1]):c[1]}</span>`).join(" · ");
show(stats()+`<div class="card"><p>${x.r}</p><p>${ch}</p></div><button class="p" onclick="hub()">Continuar</button>`)}
function hub(msg){show(stats()+(msg?`<div class="card">${msg}</div>`:"")+`<h2>¿Qué haces este mes?</h2>
<button onclick="travel()">✈️ Viajar a otra ciudad <span class="mu">($350)</span></button>
<button onclick="jobs()">💼 Cambiar de trabajo</button>
<button onclick="send()">💌 Mandar $500 a tu familia</button>
<button onclick="toggleIns()">🩺 Seguro médico: ${s.ins?'ACTIVO (quitar)':'Contratar'} <span class="mu">($200/mes)</span></button>
<button onclick='talk()'>💬 Hablar con alguien</button>
<button onclick='family()'>👨‍👩‍👧 Tu familia</button>
<button onclick='places()'>🗺️ Lugares y personajes</button>
<button onclick='race()'>🏎️ Carrera de carros</button>
<button onclick='smoke()'>🚬 Cigarros</button>
<button onclick='biz()'>🏪 Tu propio negocio</button>
<button onclick='rob()'>🕶️ Hacer algo ilegal</button>
<button class="p" onclick="next()">Pasar al mes siguiente →</button>`)}
function travel(){show(stats()+`<h2>¿A dónde viajas?</h2><p class="mu">Cuesta $350 y pierdes un poco de ánimo por la mudanza.</p>`+
Object.keys(C).filter(k=>k!=s.city).map(k=>`<button ${s.money<350?"disabled":""} onclick="move('${k}')">${C[k].e} <b>${C[k].n}</b><br><span class="mu">${C[k].d} · alquiler ${fm(C[k].rent)}</span></button>`).join("")+`<button onclick="hub()">← Volver</button>`)}
function move(k){s.money-=350;s.mood=cl(s.mood-5);s.city=k;hub(`Te mudas a <b>${C[k].n}</b>. Todo es nuevo otra vez.`)}
function jobs(){show(stats()+`<h2>Trabajos</h2>`+Object.keys(J).map(k=>{const j=J[k],ok=s.eng>=j.min,p=j.pay*(C[s.city].b[k]||1);
return `<button ${ok&&k!=s.job?"":"disabled"} onclick="setJob('${k}')"><b>${j.n}</b> · ${fm(p)}/mes<br><span class="mu">${ok?(k==s.job?"Trabajo actual":"Disponible"):"Necesitas inglés "+j.min}</span></button>`}).join("")+`<button onclick="hub()">← Volver</button>`)}
function setJob(k){s.job=k;hub(`Ahora trabajas en: <b>${J[k].n}</b>.`)}
const hosp=n=>s.ins?Math.round(n*.1):n;
const B=['Tienda de ropa','Taller mecánico','Venta de comida'];
const SN=['Pérez','Gómez','Ruiz','Torres','Díaz','Silva','Mora','Vega'];
function bizTick(){if(s.smoke)s.smoke=Math.max(0,s.smoke-1);s.visits=0;if(!s.biz)return;s.biz.clients.forEach(c=>c.age++);s.biz.clients=s.biz.clients.filter(c=>c.age<4);const n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)s.biz.clients.push({n:NM[Math.floor(Math.random()*NM.length)]+' '+SN[Math.floor(Math.random()*SN.length)],owed:50*(3+Math.floor(Math.random()*10)),age:0})}
function biz(msg){if(!s.biz)return show(stats()+"<h2>🏪 Tu propio negocio</h2><p class='mu'>Abrir uno cuesta $1,500 y después $200 al mes de local. Vendes a crédito: tus clientes te deben dinero y tienes que ir a cobrarles. Tienes 3 visitas por mes. Si pasan 4 meses sin cobrar, pierdes esa deuda.</p>"+B.map((b,i)=>`<button onclick='openBiz(${i})'>${b}</button>`).join('')+"<button onclick='hub()'>← Volver</button>");
const cs=s.biz.clients,tot=cs.reduce((a,c)=>a+c.owed,0);

$i('jtm').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');}

function toggleIns(){s.ins=!s.ins;hub(s.ins?'Contratas un seguro médico. Cuesta $200 al mes, pero un hospital te costaría mucho menos.':'Cancelas tu seguro médico. Ahorras $200 al mes, pero corres riesgo.')}

function next(){const j=J[s.job],c=C[s.city],pay=j.pay*(c.b[s.job]||1)*(s.sick?.4:1),cost=c.rent+450+(s.ins?200:0)+(s.kids||0)*500-(s.partner?400:0)+(s.biz?200:0)+((s.smoke||0)>=6?80:0);s.sick=0;bizTick();
s.money+=pay-cost;s.mood=cl(s.mood+j.k+(s.mood<40?-2:0)+(s.partner?2:0)+(s.kids?1:0)-((s.smoke||0)>=6?2:0));s.eng=cl(s.eng+j.e+(s.city=="bos"?1:0));s.month++;
if(s.money<-4000||s.mood<=0)return fin(true);
if(s.month>24)return fin(false);
event()}

const t=bad?(s.reason?s.reason:s.mood<=0?"Tu ánimo se rompió. A veces hay que parar y pedir ayuda.":"Te quedaste sin dinero. Es duro, pero muchos empiezan de nuevo."):sc>1800?"🌟 Construiste una vida sólida.":sc>1100?"💪 Saliste adelante con esfuerzo.":"🌱 Fue difícil, pero sigues en pie.";
show(`<h1>${bad?"Fin del camino":"24 meses después"}</h1><p class="mu">${esc(ch.name)}, de ${ch.origin}</p><div class="card"><p>${t}</p><p>💵 ${fm(s.money)}<br>😀 Ánimo ${s.mood}<br>🗣️ Inglés ${s.eng}<br>📍 ${C[s.city].n} · ${J[s.job].n}</p><h2>Puntaje: ${sc}</h2></div><button class="p" onclick="start()">Jugar otra vez</button>`)}
start();
